name: GH-Actions
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

jobs:
  # Method 1: explicit single component.
  explicit-single:
    name: explicit-single
    runs-on: localdev-e2e-test-37362832606-2-github-5-e2e
    env:
      LUNAR_COMPONENT: services/backend-go
    defaults:
      run:
        working-directory: services/backend-go
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: QA marker
        run: /bin/echo "lunar-qa::explicit-single"
      - name: Go build
        run: |
          go version
          go mod download
          go build ./...

  # Method 2: explicit, comma-separated (multi). One job's CI is attributed to
  # BOTH named components at once (api-python intentionally excluded).
  explicit-multi:
    name: explicit-multi
    runs-on: localdev-e2e-test-37362832606-2-github-5-e2e
    env:
      LUNAR_COMPONENT: "services/backend-go,compliance"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: QA marker
        run: /bin/echo "lunar-qa::explicit-multi"
      - name: Semgrep scan (shared)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet semgrep
          semgrep scan --config auto . || true

  # Method 4: INFER via changed paths (repo root; resolves only from the
  # commit's touched files — probe A).
  infer-changed-paths:
    name: infer-changed-paths
    runs-on: localdev-e2e-test-37362832606-2-github-5-e2e
    env:
      LUNAR_COMPONENT_INFER: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: QA marker
        run: /bin/echo "lunar-qa::infer-changed-paths"

  # Method 5: INFER via process cwd (fires only when changed-paths is empty —
  # probe B).
  infer-cwd:
    name: infer-cwd
    runs-on: localdev-e2e-test-37362832606-2-github-5-e2e
    env:
      LUNAR_COMPONENT_INFER: "true"
    defaults:
      run:
        working-directory: services/api-python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
      - name: QA marker
        run: /bin/echo "lunar-qa::infer-cwd"
      - name: Compile check
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py
